
name: NexVora ORBIT CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------
  # JOB 1: FORMAT, ANALYZE AND TEST
  # ------------------------------------------

  test:
    name: Format, Analyze and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: flutter/example

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install system SQLite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
        working-directory: .

      - name: Get Flutter dependencies
        run: flutter pub get

      # Format source automatically in GitHub Runner.
      # No Dart installation is required on the user's phone.
      - name: Format ORBIT Dart source
        run: |
          dart format lib/orbit test/orbit_actions_test.dart

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter unit tests
        run: flutter test

  # ------------------------------------------
  # JOB 2: BUILD ANDROID DEBUG APK
  # ------------------------------------------

  apk-debug:
    name: Build NexVora ORBIT ARM64 Debug APK
    needs: test

    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_LATEST_HOME:-}"

          if [ -z "$NDK" ] && [ -n "${ANDROID_HOME:-}" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" \
              -mindepth 1 -maxdepth 1 -type d \
              2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using Android NDK: $NDK"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            curl \
            zip \
            unzip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Show build environment
        run: |
          flutter --version
          java -version
          cmake --version
          echo "NDK: $ANDROID_NDK_HOME"

      # --------------------------------------
      # Build Cactus native FFI library
      # --------------------------------------

      - name: Build Cactus native library
        shell: bash
        run: |
          set -euo pipefail

          chmod +x flutter/example/native/build.sh

          bash flutter/example/native/build.sh

          test -s flutter/example/android/app/src/main/jniLibs/arm64-v8a/libcactus.so

      # --------------------------------------
      # Restore native build cache
      # --------------------------------------

      - name: Cache native build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cactus-ffi
            flutter/example/native/build
            flutter/example/native_zim/build
          key: orbit-native-${{ runner.os }}-${{ hashFiles('cactus/**', 'cactus-engine/**', 'flutter/example/native/**', 'flutter/example/native_zim/**') }}
          restore-keys: |
            orbit-native-${{ runner.os }}-

      # --------------------------------------
      # Build Android APK
      # --------------------------------------

      - name: Get Flutter dependencies
        working-directory: flutter/example
        run: flutter pub get

      - name: Build ARM64 Debug APK
        working-directory: flutter/example
        run: |
          set -euo pipefail

          flutter build apk \
            --debug \
            --target-platform android-arm64

          test -s build/app/outputs/flutter-apk/app-debug.apk

      # --------------------------------------
      # Prepare APK
      # --------------------------------------

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            flutter/example/build/app/outputs/flutter-apk/app-debug.apk \
            dist/NexVora-ORBIT-Debug-arm64-v8a.apk

          cd dist

          sha256sum NexVora-ORBIT-Debug-arm64-v8a.apk \
            > NexVora-ORBIT-Debug-arm64-v8a.apk.sha256

          ls -lh

      # --------------------------------------
      # Upload APK
      # --------------------------------------

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-ORBIT-Debug-APK
          path: |
            dist/NexVora-ORBIT-Debug-arm64-v8a.apk
            dist/NexVora-ORBIT-Debug-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## NexVora ORBIT Debug Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture: ARM64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: NexVora-ORBIT-Debug-arm64-v8a.apk" >> "$GITHUB_STEP_SUMMARY"
          
